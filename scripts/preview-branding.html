<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Brand previews</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
      padding: 40px;
    }
    .frame {
      max-width: 1100px;
      width: 100%;
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 40px 80px rgba(0,0,0,0.45);
    }
    .frame img {
      display: block;
      width: 100%;
      height: auto;
      object-fit: contain;
    }
  </style>
</head>
<body>
  <div class="frame">
    <img id="shot" src="" alt="Brand preview">
  </div>
  <script>
    const params = new URLSearchParams(location.search);
    document.getElementById('shot').src = params.get('img') || '../images/brand-identity.jpg';
  </script>
</body>
</html>
